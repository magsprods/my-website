<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İnkişaf: sual ver, müzakirə et, yüksəl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("birge-theme")||"light"}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- ƏN YUXARI PANEL: yalnız logo, giriş və qeydiyyat -->
<header class="topbar">
  <nav class="bar">
    <div class="bar-l">
      <a class="logo" href="#" data-act="go" data-view="list" aria-label="İnkişaf">
        <svg class="logo-mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="2" y="13" width="5" height="9" rx="1.5"/>
          <rect x="9.5" y="8" width="5" height="14" rx="1.5"/>
          <rect x="17" y="2" width="5" height="20" rx="1.5"/>
        </svg>
        <span>İnkişaf</span>
      </a>
    </div>
    <div class="bar-r">
      <span id="auth"></span>
    </div>
  </nav>
</header>

<div class="wrap">
  <main id="app"></main>

  <footer>Hörmətlə yazın, yalnız bildiyiniz məlumatı paylaşın. Təhqir, spam, zərərli və ya başqasının şəxsi məlumatını ehtiva edən məzmun qadağandır.</footer>
</div>

<!-- COPYRIGHT -->
<footer class="site-footer">
  <p>&copy; 2026 İnkişaf. Bütün hüquqlar qorunur.</p>
</footer>

<!-- AŞAĞI PANEL: səhifələr, axtarış, sual yaz, səs, tema -->
<nav class="dock" aria-label="Əsas naviqasiya">
  <div class="dock-inner">
    <div class="dock-tabs">
      <button class="link" data-act="go" data-view="list">Suallar</button>
      <button class="link" data-act="go" data-view="board">Reytinq</button>
    </div>

    <div class="search-wrap" id="searchWrap" role="search">
      <input type="search" id="searchInput" placeholder="Sual axtar..." autocomplete="off" aria-label="Sual axtar">
      <button type="button" class="icon-btn" id="searchToggle" aria-label="Axtar (/)" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
      </button>
    </div>

    <button class="btn" data-act="go" data-view="new">Sual yaz</button>

    <button class="icon-btn" id="voiceBtn" type="button" aria-label="Səsli otaq">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>

    <button class="icon-btn" id="theme" type="button" aria-label="Qaranlıq temaya keç">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</nav>

<!-- SƏS PANELİ -->
<div class="voice" id="voicePanel" hidden>
  <div class="voice-top">
    <b>Səsli otaq</b>
    <button class="voice-close" id="voiceClose" aria-label="Bağla">✕</button>
  </div>

  <select id="voiceRoom" aria-label="Otaq seçin">
    <option value="umumi">Ümumi otaq</option>
    <option value="texnologiya">Texnologiya</option>
    <option value="tehsil">Təhsil</option>
    <option value="karyera">Karyera</option>
  </select>

  <p class="voice-status" id="voiceStatus">Otaq seçin və qoşulun</p>

  <ul class="voice-people" id="voicePeople"></ul>

  <div class="voice-actions">
    <button class="btn" id="voiceJoin">Qoşul</button>
    <button class="btn alt" id="voiceMute" hidden>Səssiz</button>
    <button class="btn alt" id="voiceLeave" hidden>Çıx</button>
  </div>

  <div id="voiceAudio" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=5" defer></script>
<script src="voice.js" defer></script>
</body>
</html>
